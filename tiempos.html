<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Analisis de tiempos Secado Mecánico</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <style>
/* ===============================
   RESET Y BASE
================================ */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #f2f2f2 0%, #e6e6e6 100%);
  color: #333;
  padding: 16px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ===============================
   CABECERA
================================ */
.header {
  text-align: center;
  margin-bottom: 24px;
  padding: 16px;
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(134, 0, 99, 0.12);
}

.header h1 {
  font-size: 1.5rem;
  color: #860062;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.header nav { margin-top: 6px !important; }
.header nav a { background: #860062 !important; color: #fff !important; }
.header nav a:hover,
.header nav a[aria-current="page"] { background: #f78c2a !important; border-color: #f78c2a !important; color: #860062 !important; }

.header i {
  color: #f78c2a;
}

/* ===============================
   SECCIONES
================================ */
.section {
  margin-bottom: 24px;
  background: #ffffff;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
  position: relative;
  overflow: hidden;
}

.section::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  height: 4px;
  width: 100%;
  background: linear-gradient(to right, #860062, #f78c2a);
}

/* ===============================
   TÍTULOS DE SECCIÓN
================================ */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.section-header h2 {
  font-size: 1.3rem;
  color: #860062;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ===============================
   TARJETAS
================================ */
.cards {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
}

/* === Primeras 3 tarjetas (marca) === */
.card:nth-child(1) {
  background: linear-gradient(135deg, #860062, #b34a8d);
  color: #fff;
}

.card:nth-child(2) {
  background: linear-gradient(135deg, #f78c2a, #ffc085);
  color: #fff;
}

.card:nth-child(3) {
  background: linear-gradient(135deg, #860062, #b45a9e);
  color: #fff;
}

/* === Resto de tarjetas === */
.card:nth-child(n+4) {
  background: linear-gradient(135deg, #ffffff, #f4f4f4);
  color: #333;
}

.card {
  padding: 18px 14px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 110px;
  position: relative;
  overflow: hidden;
}

.card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    rgba(255, 255, 255, 0.12),
    rgba(0, 0, 0, 0.05)
  );
  pointer-events: none;
}

.card:active,
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
}

/* ===============================
   TEXTO DE TARJETAS
================================ */
.card-title {
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 8px;
  line-height: 1.3;
}

.card:nth-child(n+4) .card-title {
  color: #555;
}

.card-value {
  font-size: 1.5rem;
  font-weight: bold;
}

.card:nth-child(n+4) .card-value {
  color: #860062;
}

/* ===============================
   TARJETA DESTACADA DISCRETA
================================ */
.card.destacada-vertical {
  background: linear-gradient(135deg, #ffffff, #f4f4f4);
  border-left: 5px solid #ffffff; /* Azul corporativo */
  box-shadow: 0 6px 16px rgba(255, 255, 255, 0.18);
}



.card.destacada-vertical .card-title {
  color: #444;
}

.card.destacada-vertical .card-value {
  color: #860062; /* color principal de marca */
  font-weight: 700;
}

/* Hover suave (igual a cards normales pero un poco más elegante) */
.card.destacada-vertical:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 22px rgba(55, 53, 192, 0.25);
}


/* ===============================
   BOTONES Y FILTROS
================================ */
.toggle-btn {
  padding: 10px 16px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(to right, #860062, #f78c2a);
  color: #fff;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 10px rgba(134, 0, 99, 0.35);
}

.toggle-btn:active {
  transform: scale(0.97);
}

.filter {
  margin-bottom: 20px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  background: #f7f7f7;
  padding: 16px;
  border-radius: 12px;
}

.filter label {
  font-weight: 600;
  color: #860062;
}

select {
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  background: #fff;
  font-size: 0.95rem;
}

select:focus {
  outline: none;
  border-color: #f78c2a;
  box-shadow: 0 0 0 3px rgba(0, 165, 181, 0.25);
}

/* ===============================
   ESTADOS
================================ */
.loading {
  text-align: center;
  padding: 40px;
  color: #860062;
}

.error {
  text-align: center;
  padding: 20px;
  background: #ffeaea;
  border-radius: 12px;
  color: #d83548;
}

/* ===============================
   RESPONSIVE
================================ */
@media (max-width: 768px) {
  body { padding: 12px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}

@media (max-width: 480px) {
  .cards { grid-template-columns: 1fr 1fr; }
  .section-header { flex-direction: column; align-items: flex-start; }
}

/* ===============================
   ANIMACIONES
================================ */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.card {
  animation: fadeIn 0.5s ease forwards;
  opacity: 0;
}

/* Scroll suave */
html { scroll-behavior: smooth; }



.header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 16px; margin:0 -16px 18px; padding:8px 16px; border-radius:0 0 14px 14px; box-shadow:0 5px 18px rgba(53,38,56,.10); }
.header h1 { font-size:1.15rem; }
.header nav { margin-top:0 !important; }
@media (max-width:700px) { .header { justify-content:center; } .header nav { width:100%; } .header h1 { justify-content:center; font-size:1rem; } }</style>

</head>
<body>
  <!-- CABECERA -->
  <div class="header">
    <h1><i class="fas fa-chart-line"></i> Analisis de tiempos Secado Mecánico</h1>
    <nav aria-label="Navegación principal" style="display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px;">
      <a href="index.html" style="padding:8px 14px;border-radius:999px;background:#860062;color:#fff;text-decoration:none;font-weight:600;">Inicio</a>
      <a href="metricas.html" style="padding:8px 14px;border-radius:999px;background:#f2e8f1;color:#6b1455;text-decoration:none;font-weight:600;">Métricas OEE</a>
      <a href="tiempos.html" aria-current="page" style="padding:8px 14px;border-radius:999px;background:#860062;color:#fff;text-decoration:none;font-weight:600;">Tiempos</a>
      <a href="Motores.html" style="padding:8px 14px;border-radius:999px;background:#f2e8f1;color:#6b1455;text-decoration:none;font-weight:600;">Motores</a>
    </nav>
  </div>

  <!-- SECCIÓN 1 -->
  <div class="section" id="promedios-generales">
    <div class="section-header">
      <h2><i class="fas fa-chart-bar"></i> Generales</h2>
    </div>
    <div class="cards" id="cards-generales">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i> Cargando datos generales...
      </div>
    </div>
  </div>

  <!-- SECCIÓN 2 -->
  <div class="section" id="tren-verticales">
    <div class="section-header">
      <h2><i class="fas fa-industry"></i> Verticales</h2>
      <button class="toggle-btn" onclick="toggleSection('cards-trenes')">
        <i class="fas fa-eye"></i> <span class="toggle-text">Mostrar</span>
      </button>
    </div>
    <div class="cards" id="cards-trenes" style="display:none;"></div>
  </div>

  <!-- SECCIÓN 3 -->
  <div class="section" id="guardiolas">
    <div class="section-header">
      <h2><i class="fas fa-tachometer-alt"></i> Guardiolas</h2>
      <button class="toggle-btn" onclick="toggleSection('cards-guardiolas')">
        <i class="fas fa-eye"></i> <span class="toggle-text">Mostrar</span>
      </button>
    </div>
    <div class="filter">
      <label for="guardiolas-filter"><i class="fas fa-filter"></i> Filtrar:</label>
      <select id="guardiolas-filter">
        <option value="general">Todos</option>
        <option value="directas">Cargas directas</option>
        <option value="completos">Ciclos completos</option>
      </select>
    </div>
    <div class="cards" id="cards-guardiolas" style="display:none;"></div>
  </div>
<!-- BOTÓN FLOTANTE -->
<a href="index.html" id="boton-flotante" class="boton-flotante">🏠 Inicio</a>

<style>
/* Estilo del botón flotante */
.boton-flotante {
  position: fixed;
  bottom: 20px;               /* Distancia desde abajo */
  right: 20px;                /* Distancia desde la derecha */
  background-color: #860062;  /* Color azul */
  color: white;
  padding: 15px 20px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  opacity: 0.7;               /* Transparencia inicial */
  transition: opacity 0.3s, transform 0.3s;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  z-index: 1000;
}

.boton-flotante:hover {
  opacity: 1;                 /* Opaco al pasar el mouse */
  transform: scale(1.1);      /* Zoom sutil */
}

.boton-flotante.oculto {
  opacity: 0;
  transform: scale(0);
  pointer-events: none;       /* No se puede clicar mientras desaparece */
  transition: opacity 0.5s, transform 0.5s;
}
</style>

<script>
// Función para animar y redirigir al pulsar
const boton = document.getElementById('boton-flotante');

boton.addEventListener('click', function(e) {
  e.preventDefault();              // Evita que navegue de inmediato
  boton.classList.add('oculto');   // Añade animación de salida

  setTimeout(() => {
    window.location.href = boton.href; // Redirige tras animación
  }, 500); // Coincide con la transición CSS
});
</script>

  <!-- MENSAJES DE ERROR -->
  <div id="error-container" style="display:none;"></div>

  <script>
    const SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/1lFHQO8f33dK2W9tDbg0_74_0fddNU449ooAy-WuHdvg/export?format=csv&gid=845379377";

    const headers = {
      generales: ["Promedio general de secado","Promedio de ciclo en verticales","Promedio general de secado en guardiolas"],
      trenes: ["Promedio de ciclo tren 1","Promedio de ciclo tren 2","Promedio de ciclo vertical 1","Promedio de ciclo vertical 2","Promedio de ciclo vertical 3","Promedio de ciclo vertical 4","Promedio de ciclo vertical 5","Promedio de ciclo vertical 6","Promedio de ciclo vertical 7","Promedio de ciclo vertical 8"],
      guardiolas: {
        general: ["Promedio general de secado en guardiolas","TiemposTren1Guardiolas","TiemposTren2Guardiolas","Promedio G1","Promedio G2","Promedio G3","Promedio G4","Promedio G5","Promedio G6","Promedio G7","Promedio G8","Promedio G9","Promedio G10","Promedio G11","Promedio G12","Promedio G13","Promedio G14","Promedio G15","Promedio G16","Promedio G17","Promedio G18"],
        directas: ["Promedio general de secado de cargas directas a guardiolas","Promedio cargas directas Tren 1","Promedio cargas directas Tren 2","Promedio cargas directas G1","Promedio cargas directas G2","Promedio cargas directas G3","Promedio cargas directas G4","Promedio cargas directas G5","Promedio cargas directas G6","Promedio cargas directas G7","Promedio cargas directas G8","Promedio cargas directas G9","Promedio cargas directas G10","Promedio cargas directas G11","Promedio cargas directas G12","Promedio cargas directas G13","Promedio cargas directas G14","Promedio cargas directas G15","Promedio cargas directas G16","Promedio cargas directas G17","Promedio cargas directas G18"],
        completos: ["Promedio general de secado ciclo completo","Promedio ciclo completo Tren 1","Promedio ciclo completo Tren 2","Promedio ciclo completo G1","Promedio ciclo completo G2","Promedio ciclo completo G3","Promedio ciclo completo G4","Promedio ciclo completo G5","Promedio ciclo completo G6","Promedio ciclo completo G7","Promedio ciclo completo G8","Promedio ciclo completo G9","Promedio ciclo completo G10","Promedio ciclo completo G11","Promedio ciclo completo G12","Promedio ciclo completo G13","Promedio ciclo completo G14","Promedio ciclo completo G15","Promedio ciclo completo G16","Promedio ciclo completo G17","Promedio ciclo completo G18"]
      }
    };

    function renderCards(containerId, labels, data) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";

  if (!data || Object.keys(data).length === 0) {
    container.innerHTML = `<div class="error">No hay datos disponibles</div>`;
    return;
  }

  labels.forEach(label => {
    const value = data[label]?.trim() || "-";
    const card = document.createElement("div");
    card.className = "card";

    // 👉 DESTACAR TARJETA ESPECÍFICA
    if (label === "Promedio de ciclo vertical 1") {
      card.classList.add("destacada-vertical");
    }

    card.innerHTML = `
      <div class="card-title">${label}</div>
      <div class="card-value">${value}</div>
    `;

    container.appendChild(card);
  });
}


    function toggleSection(id) {
      const el = document.getElementById(id);
      const isHidden = el.style.display === "none";
      el.style.display = isHidden ? "grid" : "none";
      
      // Actualizar texto del botón
      const btn = el.closest(".section").querySelector(".toggle-btn");
      const icon = btn.querySelector("i");
      const text = btn.querySelector(".toggle-text");
      
      if (isHidden) {
        icon.className = "fas fa-eye-slash";
        text.textContent = "Ocultar";
      } else {
        icon.className = "fas fa-eye";
        text.textContent = "Mostrar";
      }
      
      // Animar la aparición/desaparición
      if (isHidden) {
        el.style.opacity = "0";
        setTimeout(() => {
          el.style.transition = "opacity 0.3s ease";
          el.style.opacity = "1";
        }, 10);
      }
    }

    function showError(message) {
      const container = document.getElementById("error-container");
      container.style.display = "block";
      container.innerHTML = `
        <div class="error">
          <i class="fas fa-exclamation-triangle"></i>
          <p>${message}</p>
          <button class="refresh-btn" onclick="loadData()">
            <i class="fas fa-redo"></i> Reintentar
          </button>
        </div>
      `;
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          if (quoted && text[i + 1] === '"') { field += '"'; i++; }
          else quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(field.trim()); field = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && text[i + 1] === "\n") i++;
          row.push(field.trim());
          if (row.some(value => value !== "")) rows.push(row);
          row = []; field = "";
        } else field += char;
      }
      if (field || row.length) {
        row.push(field.trim());
        if (row.some(value => value !== "")) rows.push(row);
      }
      return rows;
    }

    function loadViaJsonp() {
      return new Promise((resolve, reject) => {
        const callback = `tiemposGviz_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const script = document.createElement("script");
        script.id = callback;
        const cleanup = () => {
          clearTimeout(timeout);
          delete window[callback];
          script.remove();
        };
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Google Sheets no respondió a tiempo"));
        }, 12000);

        window[callback] = response => {
          cleanup();
          try {
            if (!response?.table?.cols || !response?.table?.rows) throw new Error("Respuesta inválida de Google Sheets");
            const keys = response.table.cols.map(column => (column.label || "").trim());
            const firstRow = response.table.rows[0];
            if (!firstRow?.c) throw new Error("La hoja no contiene filas de datos");
            const values = firstRow.c.map(cell => {
              if (!cell) return "";
              if (cell.f !== undefined && cell.f !== null) return String(cell.f);
              return cell.v === undefined || cell.v === null ? "" : String(cell.v);
            });
            resolve({ keys, values });
          } catch (error) { reject(error); }
        };
        script.onerror = () => {
          cleanup();
          reject(new Error("No se pudo consultar Google Sheets"));
        };
        script.src = `https://docs.google.com/spreadsheets/d/1lFHQO8f33dK2W9tDbg0_74_0fddNU449ooAy-WuHdvg/gviz/tq?tqx=responseHandler:${callback}&gid=845379377&_=${Date.now()}`;
        document.head.appendChild(script);
      });
    }

    async function loadData() {
      try {
        // Ocultar cualquier error anterior
        document.getElementById("error-container").style.display = "none";
        
        let keys;
        let values;
        let fetchError;
        try {
          const res = await fetch(SPREADSHEET_URL, { cache: "no-store" });
          if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
          const text = await res.text();
          const rows = parseCsv(text);
          if (rows.length < 2 || !rows[0].some(key => key.replace(/^\uFEFF/, "").trim() === headers.generales[0])) {
            throw new Error("La respuesta CSV no contiene los encabezados esperados");
          }
          [keys, values] = rows;
        } catch (error) {
          fetchError = error;
          console.warn("No se pudo cargar el CSV directamente; se probará Google Sheets JSONP:", error.message);
          try {
            ({ keys, values } = await loadViaJsonp());
          } catch (jsonpError) {
            throw new Error(`Fallaron ambos métodos de carga. CSV: ${error.message}. Google Sheets: ${jsonpError.message}`);
          }
        }
        const data = {};
        keys.forEach((k,i) => {
          const cleanKey = k.replace(/^\uFEFF/, "").trim();
          if (cleanKey) data[cleanKey] = values[i]?.trim() || "";
        });
        if (!data[headers.generales[0]]) {
          throw new Error(`No se encontraron los encabezados de tiempos. ${fetchError ? `CSV: ${fetchError.message}` : ""}`);
        }

        // Renderizar datos
        renderCards("cards-generales", headers.generales, data);
        renderCards("cards-trenes", headers.trenes, data);
        renderCards("cards-guardiolas", headers.guardiolas.general, data);

        // Configurar filtro de guardiolas
        document.getElementById("guardiolas-filter").onchange = (e)=>{
          const value = e.target.value;
          if(value==="directas") renderCards("cards-guardiolas", headers.guardiolas.directas, data);
          else if(value==="completos") renderCards("cards-guardiolas", headers.guardiolas.completos, data);
          else renderCards("cards-guardiolas", headers.guardiolas.general, data);
        };

      } catch(err) {
        console.error("Error cargando datos:", err);
        showError(`No se pudieron cargar los datos desde Google Sheets: ${err.message}`);
      }
    }

    // Cargar datos al iniciar y cada 5 minutos
    loadData();
    setInterval(loadData, 5 * 60 * 1000);
    
    // Mejorar experiencia táctil
    document.addEventListener('touchstart', function() {}, {passive: true});
  </script>

</body>
</html>
